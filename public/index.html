<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>德州撲克</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>♠ 德州撲克</h1>
    <div class="meta">盲注 <span id="blinds"></span> · 第 <span id="handNo">0</span> 手</div>
    <button id="newGame" class="ghost">新遊戲</button>
  </header>

  <main>
    <section class="table" id="table">
      <div class="felt">
        <div class="center">
          <div class="pot" id="pot">底池 0</div>
          <div class="board" id="board"></div>
          <div class="message" id="message"></div>
        </div>
      </div>
      <div id="seats"></div>
    </section>

    <section class="controls" id="controls">
      <div class="row">
        <button id="btnFold" class="danger">棄牌</button>
        <button id="btnCall">過牌</button>
        <button id="btnAllIn" class="warn">全下</button>
      </div>
      <div class="row raise">
        <button class="ghost small" data-size="0.5">½ 池</button>
        <button class="ghost small" data-size="1">1 池</button>
        <input type="range" id="raiseRange" step="10">
        <input type="number" id="raiseInput" step="10" inputmode="numeric">
        <button id="btnRaise" class="primary">加注</button>
      </div>
      <div class="row">
        <button id="btnNext" class="primary wide">下一手</button>
      </div>
    </section>

    <section class="log">
      <h2>牌局紀錄</h2>
      <ol id="log"></ol>
    </section>
  </main>

  <script src="/game.js"></script>
</body>
</html>
